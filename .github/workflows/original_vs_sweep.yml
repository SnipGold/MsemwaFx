name: Original vs Sweep Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/original-vs-sweep
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run same-candle comparison
        working-directory: smc_bot
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          BACKTEST_OUTPUT: ../research/original_vs_sweep_results.csv
          BACKTEST_RISK_FRACTION: "0.005"
          BACKTEST_MAX_DAILY_LOSS_R: "3.0"
        run: python research/backtest_compare.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-vs-sweep-results
          path: research/original_vs_sweep_results.csv
          if-no-files-found: warn
          retention-days: 30
