name: MsemwaFx Schedule Probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report scheduler event
        run: |
          echo "MsemwaFx schedule probe started."
          echo "Event: ${{ github.event_name }}"
          echo "UTC time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Branch: ${{ github.ref }}"
