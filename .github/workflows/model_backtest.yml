name: MsemwaFX Separate Model Backtest
on:
  push:
    paths:
      - "research/model_backtest.py"
      - ".github/workflows/model_backtest.yml"
      - "replay_data/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python research/model_backtest.py
      - name: Commit results
        run: |
          git config user.name "msemwafx-backtest"
          git config user.email "msemwafx-backtest@users.noreply.github.com"
          git add model_backtest_results/
          git diff --cached --quiet && exit 0
          git commit -m "Run separate SMC ICT model backtests"
          git push
