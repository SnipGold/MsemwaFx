name: MA Strategy Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "MA_Signal/ma_backtest.py"
      - "MA_Signal/backtest_README.md"
      - ".github/workflows/ma_backtest.yml"

permissions:
  contents: read
concurrency:
  group: ma-strategy-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Backtest and send Telegram report
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python MA_Signal/ma_backtest.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ma-strategy-backtest-results
          path: MA_Signal/results/
          if-no-files-found: warn
          retention-days: 30
