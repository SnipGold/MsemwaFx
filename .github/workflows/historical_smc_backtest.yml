name: Historical SMC Backtest

on:
  push:
    branches:
      - feature/validated-demand-supply-zones
    paths:
      - "research/smc_historical_backtest.py"
      - "replay_data/**"
      - ".github/workflows/historical_smc_backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backtest dependencies
        run: python -m pip install pandas numpy
      - name: Run historical comparison
        run: python research/smc_historical_backtest.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: smc-historical-backtest-results
          path: smc_backtest_results/
          if-no-files-found: error
