name: MsemwaFx SMC ICT Bot

on:
  push:
    paths:
      - ".github/workflows/smc_bot.yml"
  pull_request:
    paths:
      - "smc_bot/**"
      - "replay_all_pairs.py"
      - "replay_data/**"
      - "scripts/**"
      - ".github/workflows/smc_bot.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  # Keep PR backtests separate from the scheduled scanner on main.
  group: msemwafx-smc-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: smc_bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        working-directory: smc_bot
        run: python -m unittest discover -s tests -v
      - name: Download at least 90 days of OHLC history
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python scripts/fetch_three_months.py
      - name: Run historical replay with patched structure detector
        run: python replay_all_pairs.py
      - name: Compare structural and tighter stop models
        run: python scripts/compare_stop_models.py
      - name: Upload replay and stop comparison results
        uses: actions/upload-artifact@v4
        with:
          name: patched-structure-replay
          path: |
            replay_all_results.csv
            replay_all_summary.csv
            stop_model_comparison.csv
            stop_model_summary.csv
          if-no-files-found: error

  scan:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: smc_bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate zone engine (retry up to 3 times)
        working-directory: smc_bot
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Zone-engine validation attempt $attempt/3"
            if python -m unittest discover -s tests -v; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Validation failed; retrying in 30 seconds."
              sleep 30
            fi
          done
          echo "Zone-engine validation failed after 3 attempts."
          exit 1
      - name: Restore bot cache and state
        uses: actions/cache@v4
        with:
          path: |
            smc_bot/data_cache
            smc_bot/sent.json
          key: msemwafx-state-${{ github.run_id }}
          restore-keys: |
            msemwafx-state-
      - name: Run one MsemwaFx scan
        working-directory: smc_bot
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SCOUT_BOT_TOKEN: ${{ secrets.TELEGRAM_SCOUT_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WA_PROVIDER: ${{ secrets.WA_PROVIDER }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_APIKEY: ${{ secrets.WA_APIKEY }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "MsemwaFx scan attempt $attempt/3"
            if python main.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Scan failed; retrying in 30 seconds."
              sleep 30
            fi
          done
          echo "MsemwaFx scan failed after 3 attempts."
          exit 1
      - name: Persist alert state
        run: |
          if git diff --quiet -- smc_bot/sent.json; then exit 0; fi
          git config user.name "msemwafx-bot"
          git config user.email "msemwafx-bot@users.noreply.github.com"
          git add smc_bot/sent.json
          git commit -m "Update bot alert state"
          git push
