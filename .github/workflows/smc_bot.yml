name: MsemwaFx SMC ICT Bot

on:
  push:
    paths:
      - ".github/workflows/smc_bot.yml"
  pull_request:
    paths:
      - "smc_bot/**"
      - ".github/workflows/smc_bot.yml"
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

concurrency:
  group: msemwafx-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: smc_bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        working-directory: smc_bot
        run: python -m unittest discover -s tests -v

  scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: smc_bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate zone engine
        working-directory: smc_bot
        run: python -m unittest discover -s tests -v
      - name: Restore bot cache and state
        uses: actions/cache@v4
        with:
          path: |
            smc_bot/data_cache
            smc_bot/sent.json
          key: msemwafx-state-${{ github.run_id }}
          restore-keys: |
            msemwafx-state-
      - name: Run one MsemwaFx scan
        working-directory: smc_bot
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SCOUT_BOT_TOKEN: ${{ secrets.TELEGRAM_SCOUT_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WA_PROVIDER: ${{ secrets.WA_PROVIDER }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_APIKEY: ${{ secrets.WA_APIKEY }}
        run: python main.py
      - name: Persist alert state
        run: |
          if git diff --quiet -- smc_bot/sent.json MA_Signal/sent_signals.json; then exit 0; fi
          git config user.name "msemwafx-bot"
          git config user.email "msemwafx-bot@users.noreply.github.com"
          git add smc_bot/sent.json MA_Signal/sent_signals.json
          git commit -m "Update bot alert state"
          git push
