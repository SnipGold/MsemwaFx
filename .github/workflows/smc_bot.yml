name: MsemwaFx SMC ICT Bot CI

on:
  pull_request:
    paths:
      - "smc_bot/**"
      - ".github/workflows/smc_bot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: smc_bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        working-directory: smc_bot
        run: python -m unittest discover -s tests -v
