name: MsemwaFx SMC ICT Bot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: msemwafx-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: smc_bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore bot cache and state
        uses: actions/cache@v4
        with:
          path: |
            smc_bot/data_cache
            smc_bot/sent.json
          key: msemwafx-state-${{ github.run_id }}
          restore-keys: |
            msemwafx-state-
      - name: Run one MsemwaFx scan
        working-directory: smc_bot
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}\n          TELEGRAM_SCOUT_BOT_TOKEN: ${{ secrets.TELEGRAM_SCOUT_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WA_PROVIDER: ${{ secrets.WA_PROVIDER }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_APIKEY: ${{ secrets.WA_APIKEY }}
        run: python main.py
      - name: Persist alert state
        run: |
          if git diff --quiet -- smc_bot/sent.json; then exit 0; fi
          git config user.name "msemwafx-bot"
          git config user.email "msemwafx-bot@users.noreply.github.com"
          git add smc_bot/sent.json
          git commit -m "Update bot alert state"
          git push
